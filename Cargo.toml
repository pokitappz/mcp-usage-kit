[workspace]
resolver = "3"
members = [
    "crates/mcp-usage-kit",
    "crates/mcp-usage-export",
    "crates/mcp-usage-core",
    "crates/mcp-usage-tower",
    "crates/mcp-usage-store",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/pokitappz/mcp-usage-kit"
homepage = "https://pokitappz.github.io/mcp-usage-kit/"
keywords = ["mcp", "billing", "metering", "tower", "json-rpc"]
categories = ["asynchronous", "network-programming", "web-programming::http-server"]

# Shared dependency versions are pinned here so every crate stays in lockstep,
# following the convention in the `addressing` workspace.
#
# The workspace crates depend on each other, and every one of those requirements
# has to move in lockstep with `workspace.package.version` or the
# dependency-ordered publish fails partway through, leaving some crates released
# at the new version and the rest not. Declaring them here means the bump is one
# edit; `scripts/check-release-version.sh` verifies it in CI regardless.
#
# `mcp-usage-core` is the thinnest crate: it is the billing-semantics engine, it
# performs NO I/O, and it must stay cheap to audit. It gets serde (for
# price-book config), serde_json (for the bounded body peeks the spec forces on us
# - see docs/spec-2026-07-28-findings.md finding 2), and base64 (for the `Mcp-Name`
# sentinel encoding). Nothing else. Async, HTTP, tower, and rmcp all belong to the
# crates above it.
[workspace.dependencies]
mcp-usage-core = { version = "0.3.0", path = "crates/mcp-usage-core" }
mcp-usage-export = { version = "0.3.0", path = "crates/mcp-usage-export" }
mcp-usage-tower = { version = "0.3.0", path = "crates/mcp-usage-tower" }
mcp-usage-store = { version = "0.3.0", path = "crates/mcp-usage-store" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
axum = "0.8.9"
bytes = "1.12.1"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "service", "tokio"] }
rmcp = { version = "3.1.0", features = ["transport-streamable-http-server"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
# `tls-rustls-aws-lc-rs`, not the `ring` variant, so the durable store clients
# use the same rustls crypto provider. Redis selects aws-lc-rs through rustls's
# default provider, so SQLx follows it instead of adding a second backend.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }

# Testing
proptest = "1.8.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
debug = true
