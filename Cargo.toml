[workspace]
resolver = "3"
members = [
    "crates/mcp-usage-kit",
    "crates/mcp-usage-export",
    "crates/mcp-usage-core",
    "crates/mcp-usage-tower",
    "crates/mcp-usage-store",
    "crates/mcp-usage-edge",
]

# The Python extension is deliberately NOT a workspace member. With PyO3's
# `extension-module` feature the cdylib does not link libpython, which is what
# makes a wheel portable but also what makes `cargo test` on it fail to link.
# Keeping it out means `cargo test --workspace --all-features` stays honest,
# and the binding is proven the only way that actually matters: by running the
# shared conformance vectors from Python.
exclude = ["bindings/python"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/pokitappz/mcp-usage-kit"
homepage = "https://pokitappz.github.io/mcp-usage-kit/"
keywords = ["mcp", "billing", "metering", "tower", "json-rpc"]
categories = ["asynchronous", "network-programming", "web-programming::http-server"]

# Shared dependency versions are pinned here so every crate stays in lockstep,
# following the convention in the `addressing` workspace.
#
# The workspace crates depend on each other, and every one of those requirements
# has to move in lockstep with `workspace.package.version` or the
# dependency-ordered publish fails partway through, leaving some crates released
# at the new version and the rest not. Declaring them here means the bump is one
# edit; `scripts/check-release-version.sh` verifies it in CI regardless.
#
# `mcp-usage-core` is the thinnest crate: it is the billing-semantics engine, it
# performs NO I/O, and it must stay cheap to audit. It gets serde (for
# price-book config), serde_json (for the bounded body peeks the spec forces on
# us, where a result type is only reachable from the response body), and base64
# (for the `Mcp-Name` sentinel encoding). Nothing else. Async, HTTP, tower, and
# rmcp all belong to the crates above it.
[workspace.dependencies]
mcp-usage-core = { version = "0.3.1", path = "crates/mcp-usage-core" }
mcp-usage-export = { version = "0.3.1", path = "crates/mcp-usage-export" }
mcp-usage-tower = { version = "0.3.1", path = "crates/mcp-usage-tower" }
mcp-usage-store = { version = "0.3.1", path = "crates/mcp-usage-store" }
mcp-usage-kit = { version = "0.3.1", path = "crates/mcp-usage-kit" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.23.0"
axum = "0.8.9"
bytes = "1.12.1"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "service", "tokio"] }
# 3.4.0 is the floor, not just the lock: it renamed `ServerInfo` to
# `ServerConfig`, which the example and the integration test now use, and
# 3.2.0 has no such type.
rmcp = { version = "3.4.0", features = ["transport-streamable-http-server"] }
# The Payment challenge id is an HMAC-SHA256 binding over the challenge
# parameters, per the "Payment" HTTP authentication scheme.
hmac = "0.13.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4"] }
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
# `tls-rustls-aws-lc-rs`, not the `ring` variant, so the durable store clients
# use the same rustls crypto provider. Redis selects aws-lc-rs through rustls's
# default provider, so SQLx follows it instead of adding a second backend.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }

# Sidecar-only. These belong to `mcp-usage-edge`, which is a deployable binary
# rather than a library, so none of the published library crates inherit them.
toml = { version = "0.9.10", default-features = false, features = ["parse", "serde"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "std"] }
# `aws-lc-rs`, matching the provider redis and SQLx already select above, so the
# sidecar does not link a second rustls crypto backend.
hyper-rustls = { version = "0.27.9", default-features = false, features = ["aws-lc-rs", "http1", "http2", "native-tokio", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

# Testing
proptest = "1.8.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
debug = true
