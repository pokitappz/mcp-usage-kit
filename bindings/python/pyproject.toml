[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "mcp-usage-kit"
description = "Protocol-correct usage accounting for MCP servers."
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"
keywords = ["mcp", "billing", "metering", "fastmcp"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://pokitappz.github.io/mcp-usage-kit/"
Repository = "https://github.com/pokitappz/mcp-usage-kit"

[tool.maturin]
# One wheel per platform rather than per Python version: the extension is built
# against the stable ABI, so 3.9 and 3.13 share a binary.
features = ["pyo3/extension-module"]
module-name = "mcp_usage_kit"
strip = true
