[package]
name = "mcp-usage-python"
description = "Python bindings for the MCP usage accounting engine."
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
# The import name. `cdylib` only: this is a Python extension, not a Rust
# dependency, and an rlib would only invite someone to link it as one.
name = "mcp_usage_kit"
crate-type = ["cdylib"]

[dependencies]
# Path rather than version, so the binding and the engine can never drift
# within a checkout. A release builds them from the same tag.
mcp-usage-core = { path = "../../crates/mcp-usage-core" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39"] }
# Versioned in lockstep with pyo3 by its maintainers.
pythonize = "0.29.0"
serde_json = "1.0.145"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
