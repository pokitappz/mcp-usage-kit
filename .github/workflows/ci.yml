name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Advisories are published against code that is already merged, so waiting for
  # the next push means a known-vulnerable dependency sits undetected until
  # someone happens to commit.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  # The event name keeps the nightly advisory run from cancelling, or being
  # cancelled by, ordinary branch CI.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, document, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Lint all targets and features
        run: cargo +1.99.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all targets and features
        run: cargo +1.99.1 test --workspace --all-targets --all-features --locked
      - name: Treat documentation warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.99.1 doc --workspace --all-features --no-deps --locked
      # The overbilling numbers are published, so they have to keep being
      # reproducible. `--strict` fails when this project's own meter drifts
      # from the ground truth the suite claims is correct, which is the half of
      # it that holds us to the same standard as everyone else.
      - name: Reproduce the published overbilling measurement
        run: cargo +1.99.1 run --locked -p mcp-overbilling -- --strict
      - name: Build publishable archives
        run: cargo +1.99.1 package --workspace --locked --no-verify
      - name: Test release metadata guards
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          RELEASE_TAG="v$version" RELEASE_COMMIT=HEAD RELEASE_BASE_REF=HEAD \
            bash scripts/check-release-version.sh
          if RELEASE_TAG=v0.0.0 RELEASE_COMMIT=HEAD RELEASE_BASE_REF=HEAD \
            bash scripts/check-release-version.sh; then
            echo "A mismatched release version was accepted" >&2
            exit 1
          fi

  python:
    name: Python ${{ matrix.python }} binding
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      # The binding is excluded from the workspace, so the quality job above
      # does not reach it. It gets the same two gates here.
      - name: Check formatting
        working-directory: bindings/python
        run: cargo +1.99.1 fmt --all -- --check
      - name: Lint
        working-directory: bindings/python
        run: cargo +1.99.1 clippy --all-targets --locked -- -D warnings
      # `cargo metadata --no-deps` cannot see an excluded package, so the
      # release guard does not cover the binding's version. Checked here
      # instead, or a release would ship an engine and a binding that disagree
      # about what version they are.
      - name: Check the binding version matches the workspace
        run: |
          workspace="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          binding="$(cargo metadata --no-deps --format-version 1 \
            --manifest-path bindings/python/Cargo.toml | jq -r '.packages[0].version')"
          if [ "$workspace" != "$binding" ]; then
            echo "binding is $binding but the workspace is $workspace" >&2
            exit 1
          fi
      - name: Install build and test tooling
        run: python3 -m pip install --require-hashes -r requirements-dev.txt
      # `--locked` here too, not just on the lint step: without it a stale
      # bindings/python/Cargo.lock passes CI while the shipped wheel is built
      # from different versions than the one that was reviewed.
      - name: Build the extension
        working-directory: bindings/python
        run: RUSTUP_TOOLCHAIN=1.99.1 maturin build --release --locked --out dist --interpreter python3
      - name: Install the built wheel
        working-directory: bindings/python
        run: python3 -m pip install --no-index --find-links dist mcp-usage-kit
      # The point of the binding: the same vectors the Rust reference test
      # runs, executed from Python against the built wheel.
      - name: Run the shared conformance vectors and the API suite
        working-directory: bindings/python
        run: python3 -m pytest tests/ -q

  msrv:
    name: Rust 1.94 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the minimum supported Rust version
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Check the workspace
        run: cargo +1.94.0 check --workspace --all-targets --all-features --locked

  portability:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Check every crate
        run: cargo +1.99.1 check --workspace --all-targets --all-features --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install cargo-audit
        run: cargo +1.99.1 install cargo-audit --locked --version 0.22.2
      - name: Check RustSec advisories
        run: |
          cargo +1.99.1 audit --deny warnings
          cargo +1.99.1 audit --deny warnings --file bindings/python/Cargo.lock
          cargo +1.99.1 audit --deny warnings --file fuzz/Cargo.lock

  deny:
    name: License, source, and ban checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install cargo-deny
        run: cargo +1.99.1 install cargo-deny --locked --version 0.20.2
      - name: Check licenses, sources, bans, and advisories
        run: |
          cargo +1.99.1 deny --locked --all-features check
          cargo +1.99.1 deny --manifest-path bindings/python/Cargo.toml --config deny.toml --locked --all-features check
          cargo +1.99.1 deny --manifest-path fuzz/Cargo.toml --config deny.toml --locked --all-features check

  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libFuzzer needs nightly, which is why `fuzz/` declares its own workspace
      # and stays out of every ordinary build. This job exists so the targets
      # cannot rot: property tests on stable are the actual gate, but a fuzz
      # target that stopped compiling would otherwise go unnoticed until someone
      # reached for it.
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Build every target
        run: cargo +nightly fuzz build --fuzz-dir fuzz
      - name: Smoke-run each target
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" --fuzz-dir fuzz -- -max_total_time=20
            echo "::endgroup::"
          done

  backends:
    name: Redis and PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      # Pinned to explicit minor versions rather than a floating tag, so a
      # backend upgrade is a reviewed change rather than a surprise.
      postgres:
        image: postgres:18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
        env:
          POSTGRES_USER: usagekit
          POSTGRES_PASSWORD: usagekit
          POSTGRES_DB: usagekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Exercise the durable task stores
        env:
          MCP_USAGE_TEST_POSTGRES_URL: postgres://usagekit:usagekit@127.0.0.1:5432/usagekit
          MCP_USAGE_TEST_REDIS_URL: redis://127.0.0.1:6379
          # Without this a broken service container would look exactly like a
          # passing run, because the tests skip themselves when a backend is
          # absent.
          MCP_USAGE_REQUIRE_BACKENDS: "1"
        run: |
          cargo +1.99.1 test -p mcp-usage-store --all-features --locked --test backends
          cargo +1.99.1 test -p mcp-usage-edge --all-features --locked --test replay_security

  site:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check scripts/check-site.mjs
      - name: Check site assets and internal links
        run: node scripts/check-site.mjs
