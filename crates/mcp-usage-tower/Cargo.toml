[package]
name = "mcp-usage-tower"
description = "Tower hot path for MCP authentication, caching, and usage attribution."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/mcp-usage-tower"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
opentelemetry = ["dep:opentelemetry"]

[dependencies]
mcp-usage-export = { version = "0.1.0", path = "../mcp-usage-export" }
mcp-usage-core = { version = "0.1.0", path = "../mcp-usage-core" }
bytes = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "classification"
harness = false
